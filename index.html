<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bug Bounty Lab Tracker — Prince</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f0f0f;--bg2:#161616;--bg3:#1e1e1e;--bg4:#252525;
  --border:#2a2a2a;--border2:#333;
  --text:#e8e8e8;--text2:#999;--text3:#444;
  --green:#00d97e;--red:#ff4d4d;--amber:#f59e0b;--blue:#3b9eff;--purple:#a78bfa;
}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;padding:2rem 1rem}
.container{max-width:820px;margin:0 auto}
.top-header{margin-bottom:2rem}
.top-header h1{font-size:24px;font-weight:700;letter-spacing:-0.5px}
.top-header h1 span{color:var(--green)}
.top-header p{font-size:13px;color:var(--text2);margin-top:5px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:1.5rem}
.stat{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:14px 12px;text-align:center}
.stat-num{font-size:26px;font-weight:700}
.stat-num.green{color:var(--green)}
.stat-label{font-size:11px;color:var(--text2);margin-top:3px;text-transform:uppercase;letter-spacing:0.5px}
.overall-bar{margin-bottom:2rem}
.bar-label-row{display:flex;justify-content:space-between;font-size:12px;color:var(--text2);margin-bottom:6px}
.bar-track{height:5px;background:var(--bg3);border-radius:3px;overflow:hidden;border:1px solid var(--border)}
.bar-fill{height:100%;background:var(--green);border-radius:3px;transition:width 0.4s}
.filter-row{display:flex;gap:8px;margin-bottom:1.5rem;flex-wrap:wrap}
.filter-btn{background:var(--bg3);border:1px solid var(--border);color:var(--text2);font-size:12px;padding:5px 14px;border-radius:20px;cursor:pointer;transition:all 0.15s}
.filter-btn:hover,.filter-btn.active{background:var(--bg4);border-color:var(--border2);color:var(--text)}
.filter-btn.active{border-color:var(--green);color:var(--green)}
.section{margin-bottom:10px;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--bg2)}
.section.hidden{display:none}
.section.all-done .section-header{border-left:3px solid var(--green)}
.section-header{display:flex;align-items:center;justify-content:space-between;padding:13px 18px;cursor:pointer;user-select:none;background:var(--bg3);transition:background 0.15s}
.section-header:hover{background:var(--bg4)}
.sec-left{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sec-title{font-size:14px;font-weight:600}
.badge{font-size:10px;padding:2px 9px;border-radius:20px;font-weight:600;letter-spacing:0.3px;text-transform:uppercase}
.b-critical{background:#3d0000;color:#ff6b6b;border:1px solid #5c0000}
.b-high{background:#2d1a00;color:#f59e0b;border:1px solid #4a2d00}
.b-medium{background:#001a3d;color:#60a5fa;border:1px solid #002d5c}
.b-advanced{background:#1a0040;color:#c084fc;border:1px solid #2d006b}
.sec-right{display:flex;align-items:center;gap:10px;flex-shrink:0}
.sec-count{font-size:12px;color:var(--text2)}
.sec-prog{width:60px;height:3px;background:var(--border2);border-radius:2px;overflow:hidden}
.sec-prog-fill{height:100%;background:var(--green);border-radius:2px;transition:width 0.3s}
.chevron{color:var(--text3);font-size:18px;transition:transform 0.2s;line-height:1}
.chevron.open{transform:rotate(180deg)}
.labs{display:none}
.labs.open{display:block}
.lab-row{display:flex;align-items:flex-start;gap:12px;padding:10px 18px;cursor:pointer;border-top:1px solid var(--border);transition:background 0.12s}
.lab-row:hover{background:var(--bg3)}
.lab-row.done .lab-name{color:var(--text3);text-decoration:line-through}
.lab-row.done .lab-tag{color:var(--text3)}
.cb{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--border2);flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;transition:all 0.15s;background:var(--bg)}
.cb.checked{background:var(--green);border-color:var(--green)}
.cb svg{display:none}
.cb.checked svg{display:block}
.lab-name{font-size:13px;color:var(--text);line-height:1.45}
.lab-tag{font-size:11px;color:var(--text2);margin-top:2px}
.diff-tag{font-size:10px;padding:1px 7px;border-radius:10px;margin-left:6px;font-weight:500;vertical-align:middle}
.d-ap{background:#003d20;color:#00d97e}
.d-pr{background:#2d1a00;color:#f59e0b}
.d-ex{background:#3d0000;color:#ff6b6b}
.reset-row{text-align:right;margin-top:1.5rem;padding-bottom:2rem}
.reset-btn{background:none;border:1px solid var(--border2);color:var(--text2);font-size:12px;padding:6px 14px;border-radius:6px;cursor:pointer;transition:all 0.15s}
.reset-btn:hover{border-color:var(--red);color:var(--red)}
@media(max-width:500px){.stats{grid-template-columns:repeat(2,1fr)}.sec-prog{display:none}}
</style>
</head>
<body>
<div class="container">
<div class="top-header">
  <h1>Bug Bounty <span>Lab Tracker</span></h1>
  <p>PortSwigger Web Academy — exact lab names, bug bounty findability order. Labs prioritized by real-world findability, not CVSS severity.</p>
</div>
<div class="stats">
  <div class="stat"><div class="stat-num green" id="s-done">0</div><div class="stat-label">Completed</div></div>
  <div class="stat"><div class="stat-num" id="s-total">0</div><div class="stat-label">Total Labs</div></div>
  <div class="stat"><div class="stat-num" id="s-pct">0%</div><div class="stat-label">Progress</div></div>
  <div class="stat"><div class="stat-num" id="s-topics">0</div><div class="stat-label">Topics Done</div></div>
</div>
<div class="overall-bar">
  <div class="bar-label-row"><span>Overall progress</span><span id="bar-label">0 / 0 labs</span></div>
  <div class="bar-track"><div class="bar-fill" id="bar-fill" style="width:0%"></div></div>
</div>
<div class="filter-row">
  <button class="filter-btn active" onclick="setFilter('all',this)">All</button>
  <button class="filter-btn" onclick="setFilter('critical',this)">🔴 Critical</button>
  <button class="filter-btn" onclick="setFilter('high',this)">🟡 High</button>
  <button class="filter-btn" onclick="setFilter('medium',this)">🔵 Medium</button>
  <button class="filter-btn" onclick="setFilter('advanced',this)">🟣 Advanced</button>
  <button class="filter-btn" onclick="setFilter('incomplete',this)">Incomplete only</button>
</div>
<div id="sections"></div>
<div class="reset-row"><button class="reset-btn" onclick="resetAll()">Reset all progress</button></div>
</div>

let state={};
try{const s=localStorage.getItem('bb_tracker_v4');if(s)state=JSON.parse(s);}catch(e){}
let currentFilter='all';

function save(){try{localStorage.setItem('bb_tracker_v4',JSON.stringify(state));}catch(e){}}
function toggle(id){state[id]=!state[id];save();render();}
function toggleSection(id){state['_open_'+id]=state['_open_'+id]===false;save();render();}
function setFilter(f,el){
  currentFilter=f;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  render();
}
function resetAll(){if(confirm('Reset ALL progress? Cannot be undone.')){state={};save();render();}}

function sectionVisible(sec,done,total){
  if(currentFilter==='all')return true;
  if(currentFilter==='incomplete')return done<total;
  return sec.severity===currentFilter;
}

const dMap={ap:'ap',pr:'pr',ex:'ex'};
const dLabel={ap:'Apprentice',pr:'Practitioner',ex:'Expert'};

function render(){
  let totalDone=0,totalAll=0,topicsDone=0;
  const container=document.getElementById('sections');
  container.innerHTML='';

  DATA.forEach(sec=>{
    const done=sec.labs.filter(l=>state[l.id]).length;
    const total=sec.labs.length;
    totalDone+=done;totalAll+=total;
    if(done===total&&total>0)topicsDone++;
    const pct=total>0?Math.round(done/total*100):0;
    const isOpen=state['_open_'+sec.id]!==false;
    const allDone=done===total&&total>0;
    const visible=sectionVisible(sec,done,total);

    const bMap={critical:'b-critical',high:'b-high',medium:'b-medium',advanced:'b-advanced'};
    const bText={critical:'Critical',high:'High',medium:'Medium',advanced:'Advanced'};

    const wrap=document.createElement('div');
    wrap.className='section'+(allDone?' all-done':'')+(visible?'':' hidden');
    wrap.innerHTML=`
<div class="section-header" onclick="toggleSection('${sec.id}')">
  <div class="sec-left">
    <span class="sec-title">${sec.title}</span>
    <span class="badge ${bMap[sec.severity]}">${bText[sec.severity]}</span>
  </div>
  <div class="sec-right">
    <span class="sec-count">${done}/${total}</span>
    <div class="sec-prog"><div class="sec-prog-fill" style="width:${pct}%"></div></div>
    <span class="chevron${isOpen?' open':''}">&#8964;</span>
  </div>
</div>
<div class="labs${isOpen?' open':''}">
${sec.labs.map(l=>`
<div class="lab-row${state[l.id]?' done':''}" onclick="toggle('${l.id}')">
  <div class="cb${state[l.id]?' checked':''}">
    <svg width="11" height="9" viewBox="0 0 11 9" fill="none">
      <path d="M1 4L4 7.5L10 1" stroke="#0f0f0f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
  <div>
    <div class="lab-name">${l.name}<span class="diff-tag d-${l.d}">${dLabel[l.d]}</span></div>
  </div>
</div>`).join('')}
</div>`;
    container.appendChild(wrap);
  });

  document.getElementById('s-done').textContent=totalDone;
  document.getElementById('s-total').textContent=totalAll;
  document.getElementById('s-pct').textContent=Math.round(totalDone/totalAll*100)+'%';
  document.getElementById('s-topics').textContent=topicsDone;
  document.getElementById('bar-fill').style.width=Math.round(totalDone/totalAll*100)+'%';
  document.getElementById('bar-label').textContent=totalDone+' / '+totalAll+' labs';
}
render();
</script>
